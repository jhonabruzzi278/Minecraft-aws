<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline CI/CD & Ecosistema de Servicios AWS - Duoc UC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #07090e;
      --paper-card: #0f1422;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --teal: #38bdf8;
      --purple: #c084fc;
      --green: #4ade80;
      --yellow: #facc15;
      --border: rgba(255, 255, 255, 0.12);
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .diagram-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 1480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .meta-tags {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meta-tag {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--accent);
      text-decoration: none;
      transition: all 0.2s;
    }

    .meta-tag:hover {
      background: var(--accent);
      color: #fff;
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1150px;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    <div class="header">
      <div>
        <div class="eyebrow">DEVOPS & INTEGRACIÓN CONTINUA (CI/CD)</div>
        <h1>Pipeline Automatizado de 2 Fases & Ecosistema de Servicios AWS</h1>
      </div>
      <div class="meta-tags">
        <a href="index.html" class="meta-tag">← Volver a la Galería</a>
        <span class="meta-tag">GitHub Actions + AWS</span>
      </div>
    </div>

    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600">
        <defs>
          <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
          </marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
          </marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4ade80"/>
          </marker>
        </defs>

        <!-- SECCIÓN 1: PIPELINE CI/CD (FLUJO HORIZONTAL) -->
        <rect x="20" y="20" width="1140" height="270" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <text x="45" y="48" fill="#38bdf8" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700">PIPELINE CI/CD: GITHUB ACTIONS ➔ AWS AUTOMATION</text>

        <!-- Paso 1: Git Push -->
        <g transform="translate(45, 65)">
          <rect width="230" height="200" rx="10" fill="#181a28" stroke="#f97316" stroke-width="1.8"/>
          <text x="20" y="30" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">1. DEVELOPER PUSH</text>
          <text x="20" y="56" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Git Commit & Push</text>
          <text x="20" y="78" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">Rama: main / PR</text>
          <line x1="20" y1="90" x2="210" y2="90" stroke="rgba(255,255,255,0.1)"/>
          <text x="20" y="114" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Cambios en app.py</text>
          <text x="20" y="136" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Cambios en frontend/</text>
          <text x="20" y="158" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Modificaciones IaC</text>
          <text x="20" y="184" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">Trigger: push | dispatch</text>
        </g>

        <path d="M 285 165 H 325" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-teal)"/>

        <!-- Paso 2: Fase 1 CI -->
        <g transform="translate(335, 65)">
          <rect width="250" height="200" rx="10" fill="#131e30" stroke="#38bdf8" stroke-width="1.8"/>
          <text x="20" y="30" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">2. FASE 1: CI (VALIDACIÓN)</text>
          <text x="20" y="56" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Validación Estática</text>
          <text x="20" y="78" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">Runner: ubuntu-latest</text>
          <line x1="20" y1="90" x2="230" y2="90" stroke="rgba(255,255,255,0.1)"/>
          <text x="20" y="114" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Python 3.11 Syntax Test</text>
          <text x="20" y="136" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ terraform validate</text>
          <text x="20" y="158" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ cfn validate-template</text>
          <text x="20" y="184" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">Resultado: PASS (30s)</text>
        </g>

        <path d="M 595 165 H 635" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-teal)"/>

        <!-- Paso 3: Fase 2 CD -->
        <g transform="translate(645, 65)">
          <rect width="260" height="200" rx="10" fill="#132420" stroke="#4ade80" stroke-width="1.8"/>
          <text x="20" y="30" fill="#4ade80" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">3. FASE 2: CD (DESPLIEGUE)</text>
          <text x="20" y="56" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Despliegue a AWS</text>
          <text x="20" y="78" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">Auth: AWS Secrets Token</text>
          <line x1="20" y1="90" x2="240" y2="90" stroke="rgba(255,255,255,0.1)"/>
          <text x="20" y="114" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Auto-Detect IP de EC2</text>
          <text x="20" y="136" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Inyección IP en app.js</text>
          <text x="20" y="158" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Sync a S3 Website</text>
          <text x="20" y="184" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ SSM Restart Flask/Purpur</text>
        </g>

        <path d="M 915 165 H 955" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr-green)"/>

        <!-- Paso 4: Producción -->
        <g transform="translate(965, 65)">
          <rect width="175" height="200" rx="10" fill="#1f1830" stroke="#c084fc" stroke-width="1.8"/>
          <text x="15" y="30" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">4. EN VIVO</text>
          <text x="15" y="56" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Producción</text>
          <text x="15" y="78" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">AWS us-east-1</text>
          <line x1="15" y1="90" x2="160" y2="90" stroke="rgba(255,255,255,0.1)"/>
          <text x="15" y="114" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">• S3 Website</text>
          <text x="15" y="136" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">• Minecraft Live</text>
          <text x="15" y="158" fill="#c084fc" font-size="11" font-family="'JetBrains Mono', monospace">• DynamoDB NoSQL</text>
          <text x="15" y="184" fill="#facc15" font-size="10.5" font-family="'JetBrains Mono', monospace">Job Summary 📄</text>
        </g>

        <!-- SECCIÓN 2: ECOSISTEMA DE SERVICIOS AWS IMPLEMENTADOS Y SUGERIDOS -->
        <rect x="20" y="310" width="1140" height="265" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <text x="45" y="340" fill="#facc15" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700">ECOSISTEMA DE SERVICIOS AWS • CLOUD NATIVE ENTERPRISE</text>

        <!-- Bloque 1: Cómputo y Red -->
        <g transform="translate(45, 360)">
          <rect width="255" height="195" rx="10" fill="#151a26" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="20" y="30" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CÓMPUTO & REDES</text>
          <text x="20" y="54" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Core IaaS</text>
          <text x="20" y="80" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon VPC (10.0.0.0/16)</text>
          <text x="20" y="102" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Subnets Públicas y Privadas</text>
          <text x="20" y="124" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon EC2 (NAT & Backend)</text>
          <text x="20" y="146" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Internet Gateway</text>
          <text x="20" y="172" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ Implementado en Stack</text>
        </g>

        <!-- Bloque 2: Datos y Storage -->
        <g transform="translate(320, 360)">
          <rect width="255" height="195" rx="10" fill="#18152c" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="20" y="30" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">DATOS & STORAGE</text>
          <text x="20" y="54" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Serverless Data</text>
          <text x="20" y="80" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon DynamoDB NoSQL</text>
          <text x="20" y="102" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon S3 Website Hosting</text>
          <text x="20" y="124" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon S3 Versionado (DR)</text>
          <text x="20" y="146" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• EBS Volumes con Swap</text>
          <text x="20" y="172" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ Implementado en Stack</text>
        </g>

        <!-- Bloque 3: Seguridad y Gestión -->
        <g transform="translate(595, 360)">
          <rect width="255" height="195" rx="10" fill="#132030" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="20" y="30" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">SEGURIDAD & CONTROL</text>
          <text x="20" y="54" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Zero-Trust Cloud</text>
          <text x="20" y="80" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• AWS SSM Session Manager</text>
          <text x="20" y="102" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• SSM Parameter Store</text>
          <text x="20" y="124" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Security Groups State-Aware</text>
          <text x="20" y="146" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• IAM Roles (LabRole)</text>
          <text x="20" y="172" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ Implementado en Stack</text>
        </g>

        <!-- Bloque 4: Escalabilidad Futura -->
        <g transform="translate(870, 360)">
          <rect width="270" height="195" rx="10" fill="#241e16" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="20" y="30" fill="#facc15" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">SERVICIOS SUGERIDOS</text>
          <text x="20" y="54" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Arquitectura Futura</text>
          <text x="20" y="80" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon CloudFront CDN</text>
          <text x="20" y="102" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• AWS WAF (Anti-DDoS)</text>
          <text x="20" y="124" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• AWS Lambda Serverless</text>
          <text x="20" y="146" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace">• Amazon Route 53 (DNS)</text>
          <text x="20" y="172" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">💡 Fase 2 Enterprise</text>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
