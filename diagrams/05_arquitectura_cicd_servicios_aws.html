<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline CI/CD & Ecosistema de Servicios AWS - Duoc UC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #090b10;
      --paper-card: #131722;
      --ink: #f0f2f8;
      --ink-muted: #8c93a8;
      --accent: #eb6c36;
      --accent-soft: rgba(235, 108, 54, 0.12);
      --teal: #38bdf8;
      --purple: #a855f7;
      --green: #4ade80;
      --yellow: #facc15;
      --border: rgba(240, 242, 248, 0.1);
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .diagram-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      max-width: 1080px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .meta-tags {
      display: flex;
      gap: 0.5rem;
    }

    .meta-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.12);
      color: var(--teal);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--teal);
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    <div class="header">
      <div>
        <div class="eyebrow">DEVOPS & INTEGRACIÓN CONTINUA (CI/CD)</div>
        <h1>Pipeline Automatizado & Ecosistema de Servicios AWS Sugeridos</h1>
      </div>
      <div class="meta-tags">
        <a href="index.html" class="meta-tag" style="text-decoration: none; cursor: pointer;">← Galería</a>
        <span class="meta-tag">GitHub Actions + AWS</span>
      </div>

    </div>

    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8c93a8"/>
          </marker>
          <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4ade80"/>
          </marker>
        </defs>

        <!-- SECCIÓN 1: PIPELINE CI/CD (FLUJO HORIZONTAL) -->
        <rect x="20" y="30" width="960" height="210" rx="10" fill="rgba(255,255,255,0.01)" stroke="rgba(240,242,248,0.12)"/>
        <text x="40" y="52" fill="#38bdf8" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">PIPELINE CI/CD: GITHUB ACTIONS ➔ AWS AUTOMATION</text>

        <!-- Paso 1: Git Push -->
        <g transform="translate(40, 70)">
          <rect width="180" height="145" rx="8" fill="#181d2c" stroke="#eb6c36" stroke-width="1.5"/>
          <text x="14" y="24" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">1. DEVELOPER PUSH</text>
          <text x="14" y="44" fill="#f0f2f8" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Git Commit & Push</text>
          <text x="14" y="60" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Rama: main / PR</text>
          <line x1="14" y1="70" x2="166" y2="70" stroke="rgba(240,242,248,0.1)"/>
          <text x="14" y="88" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• Cambios en app.py</text>
          <text x="14" y="102" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• Cambios en static/</text>
          <text x="14" y="116" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• Cambios en IaC (TF/CFn)</text>
        </g>

        <!-- Flecha 1 -> 2 -->
        <path d="M 220 142 H 275" fill="none" stroke="#8c93a8" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- Paso 2: Fase CI -->
        <g transform="translate(285, 70)">
          <rect width="210" height="145" rx="8" fill="#181d2c" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="14" y="24" fill="#38bdf8" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">2. FASE CI (INTEGRACIÓN)</text>
          <text x="14" y="44" fill="#f0f2f8" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Test & Validación</text>
          <line x1="14" y1="56" x2="196" y2="56" stroke="rgba(240,242,248,0.1)"/>
          <text x="14" y="74" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace">✓ Syntax Check (Python 3.11)</text>
          <text x="14" y="90" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace">✓ terraform validate</text>
          <text x="14" y="106" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace">✓ cfn-lint / validate-template</text>
          <text x="14" y="122" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace">✓ Docker Build Test</text>
        </g>

        <!-- Flecha 2 -> 3 -->
        <path d="M 495 142 H 550" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

        <!-- Paso 3: Fase CD (Frontend) -->
        <g transform="translate(560, 70)">
          <rect width="190" height="145" rx="8" fill="#181d2c" stroke="#a855f7" stroke-width="1.5"/>
          <text x="14" y="24" fill="#a855f7" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">3. DESPLIEGUE S3 (CD)</text>
          <text x="14" y="44" fill="#f0f2f8" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Sync Frontend</text>
          <line x1="14" y1="56" x2="176" y2="56" stroke="rgba(240,242,248,0.1)"/>
          <text x="14" y="74" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• aws s3 sync static/ s3://</text>
          <text x="14" y="90" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• Invalidation CloudFront</text>
          <text x="14" y="106" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace">✓ Web Actualizada en Vivo</text>
          <text x="14" y="122" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Latencia &lt; 50ms</text>
        </g>

        <!-- Flecha 3 -> 4 -->
        <path d="M 750 142 H 800" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>

        <!-- Paso 4: Fase CD (Backend EC2) -->
        <g transform="translate(810, 70)">
          <rect width="150" height="145" rx="8" fill="#18231c" stroke="#4ade80" stroke-width="1.5"/>
          <text x="12" y="24" fill="#4ade80" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">4. REINICIO EC2</text>
          <text x="12" y="44" fill="#f0f2f8" font-size="11" font-family="'Geist', sans-serif" font-weight="600">AWS SSM Dispatch</text>
          <line x1="12" y1="56" x2="138" y2="56" stroke="rgba(240,242,248,0.1)"/>
          <text x="12" y="74" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• SSM Send-Command</text>
          <text x="12" y="90" fill="#f0f2f8" font-size="7.5" font-family="'Geist Mono', monospace">• docker compose up</text>
          <text x="12" y="106" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace">✓ Sin SSH 22 Abierto</text>
          <text x="12" y="122" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Zero Downtime</text>
        </g>


        <!-- SECCIÓN 2: OTROS SERVICIOS DE AWS RECOMENDADOS -->
        <g transform="translate(20, 265)">
          <rect width="960" height="235" rx="10" fill="#131722" stroke="rgba(240,242,248,0.15)"/>
          <text x="24" y="26" fill="#facc15" font-size="10" font-family="'Geist Mono', monospace" font-weight="700">🚀 ECOSISTEMA DE SERVICIOS AWS RECOMENDADOS PARA MAXIMIZAR EL PROYECTO</text>

          <!-- Tarjeta 1: CloudFront -->
          <g transform="translate(24, 45)">
            <rect width="215" height="165" rx="8" fill="#181d2c" stroke="#38bdf8" stroke-width="1.2"/>
            <text x="14" y="22" fill="#38bdf8" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">1. AMAZON CLOUDFRONT</text>
            <text x="14" y="40" fill="#f0f2f8" font-size="10" font-family="'Geist', sans-serif" font-weight="600">CDN Global & HTTPS</text>
            <text x="14" y="58" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Puntos de presencia globales (Santiago) para cargar el frontend en milisegundos con SSL gratuito (ACM).</text>
            <rect x="14" y="125" width="187" height="24" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
            <text x="107" y="141" fill="#38bdf8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Beneficio: Ultra Baja Latencia</text>
          </g>

          <!-- Tarjeta 2: ECR -->
          <g transform="translate(260, 45)">
            <rect width="215" height="165" rx="8" fill="#181d2c" stroke="#a855f7" stroke-width="1.2"/>
            <text x="14" y="22" fill="#a855f7" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">2. AMAZON ECR</text>
            <text x="14" y="40" fill="#f0f2f8" font-size="10" font-family="'Geist', sans-serif" font-weight="600">Elastic Container Registry</text>
            <text x="14" y="58" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Registro privado de Docker seguro con escaneo automático de vulnerabilidades y versionamiento de tags.</text>
            <rect x="14" y="125" width="187" height="24" rx="4" fill="rgba(168, 85, 247, 0.1)"/>
            <text x="107" y="141" fill="#a855f7" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Beneficio: Seguridad en Imágenes</text>
          </g>

          <!-- Tarjeta 3: Lambda + EventBridge -->
          <g transform="translate(496, 45)">
            <rect width="215" height="165" rx="8" fill="#181d2c" stroke="#4ade80" stroke-width="1.2"/>
            <text x="14" y="22" fill="#4ade80" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">3. LAMBDA + EVENTBRIDGE</text>
            <text x="14" y="40" fill="#f0f2f8" font-size="10" font-family="'Geist', sans-serif" font-weight="600">Auto-Encendido y Apagado</text>
            <text x="14" y="58" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Apaga la EC2 de noche (02:00 AM) y enciéndela de día (08:00 AM) automáticamente para ahorrar créditos.</text>
            <rect x="14" y="125" width="187" height="24" rx="4" fill="rgba(74, 222, 128, 0.1)"/>
            <text x="107" y="141" fill="#4ade80" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Beneficio: Ahorro 70% Créditos</text>
          </g>

          <!-- Tarjeta 4: SNS + Discord -->
          <g transform="translate(732, 45)">
            <rect width="204" height="165" rx="8" fill="#181d2c" stroke="#eb6c36" stroke-width="1.2"/>
            <text x="14" y="22" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">4. AMAZON SNS & BOT</text>
            <text x="14" y="40" fill="#f0f2f8" font-size="10" font-family="'Geist', sans-serif" font-weight="600">Notificaciones en Tiempo Real</text>
            <text x="14" y="58" fill="#8c93a8" font-size="7.5" font-family="'Geist Mono', monospace">Envía alertas a tu celular o a un canal de Discord cuando un jugador se registra o ante fallos del servidor.</text>
            <rect x="14" y="125" width="176" height="24" rx="4" fill="rgba(235, 108, 54, 0.1)"/>
            <text x="102" y="141" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Beneficio: Alertas Inmediatas</text>
          </g>

        </g>

      </svg>
    </div>
  </div>

</body>
</html>
