<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de Diagnóstico y Resolución de Errores - Duoc UC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #07090e;
      --paper-card: #0f1422;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --teal: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
      --border: rgba(255, 255, 255, 0.12);
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .diagram-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 1480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .meta-tags {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meta-tag {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--accent);
      text-decoration: none;
      transition: all 0.2s;
    }

    .meta-tag:hover {
      background: var(--accent);
      color: #fff;
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1100px;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    <div class="header">
      <div>
        <div class="eyebrow">TROUBLESHOOTING RUNBOOK • DIAGNÓSTICO & RESOLUCIÓN</div>
        <h1>Resolución de Errores Críticos: Firewall, Java G1GC y Redes</h1>
      </div>
      <div class="meta-tags">
        <a href="index.html" class="meta-tag">← Volver a la Galería</a>
        <span class="meta-tag">Metodología DevOps</span>
      </div>
    </div>

    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="1140" height="560">
        <defs>
          <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
          </marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4ade80"/>
          </marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
          </marker>
        </defs>

        <!-- ==================== FILA 1: CASO 1 - ERROR GETSOCKOPT ==================== -->
        <text x="40" y="32" fill="#38bdf8" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700">CASO 1: ERROR DE TIMEOUT EN CONEXIÓN MINECRAFT (GETSOCKOPT)</text>

        <!-- Paso 1: Intento -->
        <g transform="translate(40, 50)">
          <rect width="260" height="95" rx="10" fill="#131826" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="130" y="30" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle">1. Intento de Conexión</text>
          <text x="130" y="54" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Cliente Minecraft ➔ IP EC2</text>
          <text x="130" y="74" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Puerto: 25565 TCP/UDP</text>
        </g>

        <!-- Flecha 1 -> 2 (Fallo) -->
        <path d="M 300 97 H 365" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)"/>

        <!-- Paso 2: Error -->
        <g transform="translate(380, 50)">
          <rect width="290" height="95" rx="10" fill="#2d1519" stroke="#f87171" stroke-width="2"/>
          <text x="145" y="30" fill="#f87171" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">⚠️ Error getsockopt</text>
          <text x="145" y="54" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Connection timed out: getsockopt</text>
          <text x="145" y="74" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Causa: Regla REJECT en iptables</text>
        </g>

        <!-- Flecha 2 -> 3 (Solución) -->
        <path d="M 670 97 H 735" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr-green)"/>

        <!-- Paso 3: Solución -->
        <g transform="translate(750, 50)">
          <rect width="350" height="95" rx="10" fill="#11291d" stroke="#4ade80" stroke-width="2"/>
          <text x="175" y="30" fill="#4ade80" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">✓ Solución Aplicada (iptables)</text>
          <text x="175" y="54" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">iptables -I INPUT 1 -p tcp --dport 25565 -j ACCEPT</text>
          <text x="175" y="74" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Resultado: Tráfico Aceptado (20.0 TPS)</text>
        </g>

        <!-- ==================== FILA 2: CASO 2 - CRASH POR MEMORIA (OOM KILLER) ==================== -->
        <text x="40" y="195" fill="#f97316" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700">CASO 2: COLAPSO DE PROCESO JAVA POR AGOTAMIENTO DE RAM (OOM)</text>

        <!-- Paso 1: Intento -->
        <g transform="translate(40, 215)">
          <rect width="260" height="95" rx="10" fill="#131826" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="130" y="30" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle">1. Arranque sin Parámetros</text>
          <text x="130" y="54" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">java -jar purpur.jar</text>
          <text x="130" y="74" fill="#f97316" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Instancia t2.micro (1GB RAM)</text>
        </g>

        <path d="M 300 262 H 365" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)"/>

        <!-- Paso 2: Error -->
        <g transform="translate(380, 215)">
          <rect width="290" height="95" rx="10" fill="#2d1519" stroke="#f87171" stroke-width="2"/>
          <text x="145" y="30" fill="#f87171" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">⚠️ Linux OOM Killer</text>
          <text x="145" y="54" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Process killed: Out of Memory</text>
          <text x="145" y="74" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">JVM supera el 100% de memoria física</text>
        </g>

        <path d="M 670 262 H 735" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr-green)"/>

        <!-- Paso 3: Solución -->
        <g transform="translate(750, 215)">
          <rect width="350" height="95" rx="10" fill="#11291d" stroke="#4ade80" stroke-width="2"/>
          <text x="175" y="30" fill="#4ade80" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">✓ Solución: Swap + G1GC Tuning</text>
          <text x="175" y="54" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">2GB Swap (swappiness=10) + -Xms512M -Xmx850M</text>
          <text x="175" y="74" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Resultado: JVM Estable con 0 reinicios</text>
        </g>

        <!-- ==================== FILA 3: CASO 3 - GESTIÓN SEGURA ZERO-TRUST ==================== -->
        <text x="40" y="360" fill="#c084fc" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700">CASO 3: GESTIÓN DE SERVIDORES Y FUGA DE LLAVES CRIPTOGRÁFICAS</text>

        <!-- Paso 1: Intento -->
        <g transform="translate(40, 380)">
          <rect width="260" height="95" rx="10" fill="#131826" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="130" y="30" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle">1. Método Tradicional (SSH)</text>
          <text x="130" y="54" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Puerto 22 Expuesto a Internet</text>
          <text x="130" y="74" fill="#f87171" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Riesgo: Filtración de .pem en Git</text>
        </g>

        <path d="M 300 427 H 365" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)"/>

        <!-- Paso 2: Error -->
        <g transform="translate(380, 380)">
          <rect width="290" height="95" rx="10" fill="#2d1519" stroke="#f87171" stroke-width="2"/>
          <text x="145" y="30" fill="#f87171" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">⚠️ Ataques de Fuerza Bruta</text>
          <text x="145" y="54" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Escaneo de puertos constantes :22</text>
          <text x="145" y="74" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Vulnerabilidad de acceso lateral</text>
        </g>

        <path d="M 670 427 H 735" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr-green)"/>

        <!-- Paso 3: Solución -->
        <g transform="translate(750, 380)">
          <rect width="350" height="95" rx="10" fill="#11291d" stroke="#4ade80" stroke-width="2"/>
          <text x="175" y="30" fill="#4ade80" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">✓ Solución: AWS Systems Manager</text>
          <text x="175" y="54" fill="#f8fafc" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Puerto 22 Cerrado (Zero-Trust SSM Agent)</text>
          <text x="175" y="74" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Resultado: Auditoría CloudTrail & Cero Llaves</text>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
