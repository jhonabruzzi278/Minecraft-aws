<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline IaC Enterprise - CloudFormation vs Terraform - Duoc UC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #07090e;
      --paper-card: #0f1422;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --teal: #38bdf8;
      --purple: #c084fc;
      --green: #4ade80;
      --border: rgba(255, 255, 255, 0.12);
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .diagram-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 1480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .meta-tags {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meta-tag {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--accent);
      text-decoration: none;
      transition: all 0.2s;
    }

    .meta-tag:hover {
      background: var(--accent);
      color: #fff;
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1100px;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    <div class="header">
      <div>
        <div class="eyebrow">DEVOPS & INFRAESTRUCTURA COMO CÓDIGO (IaC)</div>
        <h1>Comparativa y Pipelines de Despliegue: CloudFormation vs Terraform</h1>
      </div>
      <div class="meta-tags">
        <a href="index.html" class="meta-tag">← Volver a la Galería</a>
        <span class="meta-tag">IaC Dual Completo</span>
      </div>
    </div>

    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="1140" height="560">
        <defs>
          <marker id="arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
          </marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
          </marker>
        </defs>

        <!-- ==================== RAMA 1: CLOUDFORMATION ==================== -->
        <g transform="translate(40, 20)">
          <rect width="1060" height="235" rx="12" fill="rgba(249, 115, 22, 0.03)" stroke="#f97316" stroke-width="2"/>
          <text x="30" y="32" fill="#f97316" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="800">OPCIÓN A: AWS CLOUDFORMATION (STACK NATIVO DECLARATIVO)</text>

          <!-- Paso 1 -->
          <g transform="translate(30, 50)">
            <rect width="280" height="155" rx="10" fill="#181524" stroke="#f97316" stroke-width="1.5"/>
            <text x="20" y="28" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">1. PLANTILLA YAML</text>
            <text x="20" y="52" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">cd-cloud-native-duoc.yaml</text>
            <text x="20" y="76" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Stack Monolítico de 700 líneas</text>
            <text x="20" y="96" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Parámetros e IPs configurables</text>
            <text x="20" y="116" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Mappings de AMIs por región</text>
            <text x="20" y="136" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ Pseudo-parámetros AWS</text>
          </g>

          <path d="M 330 127 H 385" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/>

          <!-- Paso 2 -->
          <g transform="translate(400, 50)">
            <rect width="290" height="155" rx="10" fill="#181524" stroke="#f97316" stroke-width="1.5"/>
            <text x="20" y="28" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">2. VALIDACIÓN DE SINTAXIS</text>
            <text x="20" y="52" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">AWS CLI Validation</text>
            <text x="20" y="76" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace">aws cloudformation</text>
            <text x="20" y="96" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace">validate-template</text>
            <text x="20" y="122" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Sin costos • Chequeo estático</text>
          </g>

          <path d="M 710 127 H 765" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/>

          <!-- Paso 3 -->
          <g transform="translate(780, 50)">
            <rect width="250" height="155" rx="10" fill="#181524" stroke="#f97316" stroke-width="1.5"/>
            <text x="20" y="28" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">3. DESPLIEGUE ATÓMICO</text>
            <text x="20" y="52" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">Stack Execution</text>
            <text x="20" y="76" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace">aws cloudformation deploy</text>
            <text x="20" y="96" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Auto-Rollback ante fallos</text>
            <text x="20" y="116" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• ChangeSets para auditoría</text>
            <text x="20" y="136" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ Estado gestionado por AWS</text>
          </g>
        </g>

        <!-- ==================== RAMA 2: TERRAFORM ==================== -->
        <g transform="translate(40, 280)">
          <rect width="1060" height="255" rx="12" fill="rgba(192, 132, 252, 0.03)" stroke="#c084fc" stroke-width="2"/>
          <text x="30" y="32" fill="#c084fc" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="800">OPCIÓN B: HASHICORP TERRAFORM (ARQUITECTURA MODULAR MULTI-NUBE)</text>

          <!-- Paso 1 -->
          <g transform="translate(30, 50)">
            <rect width="280" height="175" rx="10" fill="#18142c" stroke="#c084fc" stroke-width="1.5"/>
            <text x="20" y="28" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">1. ESTRUCTURA MODULAR</text>
            <text x="20" y="52" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">terraform/ (4 Módulos)</text>
            <text x="20" y="76" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• modules/networking/ (VPC)</text>
            <text x="20" y="96" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• modules/storage/ (Dynamo/S3)</text>
            <text x="20" y="116" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• modules/security/ (IAM/SG)</text>
            <text x="20" y="136" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• modules/compute/ (EC2)</text>
            <text x="20" y="156" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">✓ Variables e Outputs tipados</text>
          </g>

          <path d="M 330 137 H 385" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-purple)"/>

          <!-- Paso 2 -->
          <g transform="translate(400, 50)">
            <rect width="290" height="175" rx="10" fill="#18142c" stroke="#c084fc" stroke-width="1.5"/>
            <text x="20" y="28" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">2. PLANIFICACIÓN & GRAFO</text>
            <text x="20" y="52" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">terraform plan</text>
            <text x="20" y="76" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace">terraform init</text>
            <text x="20" y="96" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace">terraform validate</text>
            <text x="20" y="120" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Grafo de dependencias DAG</text>
            <text x="20" y="140" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Vista previa: +18 recursos</text>
          </g>

          <path d="M 710 137 H 765" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-purple)"/>

          <!-- Paso 3 -->
          <g transform="translate(780, 50)">
            <rect width="250" height="175" rx="10" fill="#18142c" stroke="#c084fc" stroke-width="1.5"/>
            <text x="20" y="28" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">3. APLICACIÓN & ESTADO</text>
            <text x="20" y="52" fill="#f8fafc" font-size="14" font-family="'Outfit', sans-serif" font-weight="700">terraform apply</text>
            <text x="20" y="76" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', monospace">terraform apply -auto-approve</text>
            <text x="20" y="100" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Creación paralela</text>
            <text x="20" y="120" fill="#94a3b8" font-size="11.5" font-family="'JetBrains Mono', monospace">• Control de State (.tfstate)</text>
            <text x="20" y="140" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', monospace">✓ Salidas de IPs y URLs</text>
          </g>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
