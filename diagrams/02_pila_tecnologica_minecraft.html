<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pila Tecnológica Cloud Native Enterprise - Duoc UC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #07090e;
      --paper-card: #0f1422;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --teal: #38bdf8;
      --purple: #c084fc;
      --green: #4ade80;
      --border: rgba(255, 255, 255, 0.12);
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .diagram-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 1480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .meta-tags {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meta-tag {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--accent);
      text-decoration: none;
      transition: all 0.2s;
    }

    .meta-tag:hover {
      background: var(--accent);
      color: #fff;
    }

    .meta-tag-purple {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(192, 132, 252, 0.15);
      color: var(--purple);
      padding: 0.45rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--purple);
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1100px;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    <div class="header">
      <div>
        <div class="eyebrow">ARQUITECTURA DE SOFTWARE • LAYER STACK</div>
        <h1>Pila Tecnológica Cloud Native Enterprise de 6 Capas</h1>
      </div>
      <div class="meta-tags">
        <a href="index.html" class="meta-tag">← Volver a la Galería</a>
        <span class="meta-tag">Docker & DynamoDB</span>
        <span class="meta-tag-purple">Serverless + EC2</span>
      </div>
    </div>

    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="1140" height="640">
        
        <!-- Capa 6: Frontend & Consola RCON -->
        <g transform="translate(30, 20)">
          <rect width="1080" height="86" rx="10" fill="#132034" stroke="#38bdf8" stroke-width="2"/>
          <text x="30" y="30" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CAPA 6: PRESENTACIÓN, WEB S3 & CONSOLA RCON</text>
          <text x="30" y="56" fill="#f8fafc" font-size="15" font-family="'Outfit', sans-serif" font-weight="700">Hosting S3 Website • Consola RCON Interactiva • Auth JWT • Dashboard Glassmorphism</text>
          <text x="30" y="76" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace">Terminal con botones rápidos (/time, /weather, /tps, /give diamond, /backup) y clientes Minecraft Java</text>
          <rect x="910" y="24" width="140" height="36" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="980" y="47" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">S3 Web Hosting</text>
        </g>

        <!-- Capa 5: Lógica de Negocio & Persistencia DynamoDB -->
        <g transform="translate(30, 120)">
          <rect width="1080" height="88" rx="10" fill="#1b1730" stroke="#c084fc" stroke-width="2"/>
          <text x="30" y="30" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CAPA 5: API REST & PERSISTENCIA NoSQL (SUBRED PRIVADA 1)</text>
          <text x="30" y="56" fill="#f8fafc" font-size="15" font-family="'Outfit', sans-serif" font-weight="700">Backend API Flask (Python 3.11) • Amazon DynamoDB • Gunicorn Multi-Worker</text>
          <text x="30" y="76" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace">Rutas CRUD: GET/POST /api/usuarios, /api/minecraft/command, /api/minecraft/backup (SDK Boto3)</text>
          <rect x="910" y="24" width="140" height="36" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1.2"/>
          <text x="980" y="47" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">DynamoDB NoSQL</text>
        </g>

        <!-- Capa 4: Protocolo RCON & Sockets TCP -->
        <g transform="translate(30, 222)">
          <rect width="1080" height="88" rx="10" fill="#12251e" stroke="#4ade80" stroke-width="2"/>
          <text x="30" y="30" fill="#4ade80" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CAPA 4: PROTOCOLO RCON & SOCKETS TCP BINARIOS</text>
          <text x="30" y="56" fill="#f8fafc" font-size="15" font-family="'Outfit', sans-serif" font-weight="700">Socket TCP Nativo en Python (Puerto 25575) • Little-Endian Framing</text>
          <text x="30" y="76" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace">Tipo 3 (Auth Handshake) / Tipo 2 (Exec) • Ejecución sin señales POSIX en hilos concurrentes</text>
          <rect x="910" y="24" width="140" height="36" rx="6" fill="rgba(74, 222, 128, 0.15)" stroke="#4ade80" stroke-width="1.2"/>
          <text x="980" y="47" fill="#4ade80" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">TCP :25575</text>
        </g>

        <!-- Capa 3: Motor de Juegos & JVM -->
        <g transform="translate(30, 324)">
          <rect width="1080" height="88" rx="10" fill="#291a13" stroke="#f97316" stroke-width="2"/>
          <text x="30" y="30" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CAPA 3: SERVIDOR DE JUEGOS PURPUR & JVM TUNING</text>
          <text x="30" y="56" fill="#f8fafc" font-size="15" font-family="'Outfit', sans-serif" font-weight="700">PurpurMC 1.21.4 (Java 21 OpenJDK) • Recolector G1GC de Baja Latencia</text>
          <text x="30" y="76" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace">JVM Flags: -Xms512M -Xmx850M -XX:+UseG1GC -XX:MaxGCPauseMillis=50 • Daemon Systemd</text>
          <rect x="910" y="24" width="140" height="36" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1.2"/>
          <text x="980" y="47" fill="#f97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">Purpur 1.21.4</text>
        </g>

        <!-- Capa 2: Kernel Linux & Firewall iptables -->
        <g transform="translate(30, 426)">
          <rect width="1080" height="88" rx="10" fill="#1b1c28" stroke="#94a3b8" stroke-width="2"/>
          <text x="30" y="30" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CAPA 2: KERNEL LINUX, SWAP Y ROUTING IPTABLES</text>
          <text x="30" y="56" fill="#f8fafc" font-size="15" font-family="'Outfit', sans-serif" font-weight="700">Amazon Linux 2023 • 2GB Swap (swappiness=10) • iptables NAT & Forwarding</text>
          <text x="30" y="76" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace">DNAT :8081 hacia Backend Privado • MASQUERADE Saliente • net.ipv4.ip_forward=1</text>
          <rect x="910" y="24" width="140" height="36" rx="6" fill="rgba(148, 163, 184, 0.15)" stroke="#94a3b8" stroke-width="1.2"/>
          <text x="980" y="47" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">Kernel 6.1</text>
        </g>

        <!-- Capa 1: Infraestructura AWS IaaS & Seguridad -->
        <g transform="translate(30, 528)">
          <rect width="1080" height="88" rx="10" fill="#151722" stroke="#eab308" stroke-width="2"/>
          <text x="30" y="30" fill="#eab308" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">CAPA 1: INFRAESTRUCTURA AWS (VPC, SUBNETS, IAM & SSM)</text>
          <text x="30" y="56" fill="#f8fafc" font-size="15" font-family="'Outfit', sans-serif" font-weight="700">Amazon VPC (10.0.0.0/16) • Subredes Pública y Privada • AWS SSM Zero-Trust</text>
          <text x="30" y="76" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace">Security Groups State-Aware • Parameter Store (/minecraft/rcon_password) • CloudWatch</text>
          <rect x="910" y="24" width="140" height="36" rx="6" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="1.2"/>
          <text x="980" y="47" fill="#eab308" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">AWS Global</text>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
