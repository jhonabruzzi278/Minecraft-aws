name: CI/CD Pipeline - Cloud Native Duoc UC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. FASE CI: VALIDACIÓN, LINTING Y PRUEBAS
  # ============================================================
  continuous-integration:
    name: 🔍 Validación de Código e IaC (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🧪 Ejecutar Pruebas de Sintaxis de la API
        run: |
          cd backend
          python -c "import app; print('✓ app.py compila correctamente')"

      - name: 🛠️ Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: 📐 Validar Sintaxis de Terraform Modular
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: 📄 Validar Sintaxis de AWS CloudFormation
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: 🔍 Validar Template CloudFormation con AWS CLI
        run: |
          aws cloudformation validate-template --template-body file://cloudformation/cd-cloud-native-duoc.yaml || echo "AWS CLI validation skipped (no credentials provided in GitHub Secrets)"

  # ============================================================
  # 2. FASE CD: DESPLIEGUE AUTOMÁTICO A AMAZON S3 Y EC2
  # ============================================================
  continuous-deployment:
    name: 🚀 Despliegue Continuo a AWS (CD)
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: 🔍 Auto-Detectar IP de EC2 y Auto-Encender Servidores
        id: get_ip
        run: |
          # 1. Si las instancias están detenidas, encenderlas automáticamente
          STOPPED_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:cloudformation:stack-name,Values=cf-duoc-cloud-native" "Name=instance-state-name,Values=stopped,stopping" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || true)
          
          if [ -n "$STOPPED_IDS" ]; then
            echo "Iniciando instancias EC2 detenidas: $STOPPED_IDS ..."
            aws ec2 start-instances --instance-ids $STOPPED_IDS || true
            echo "Esperando 15 segundos..."
            sleep 15
          fi

          # 2. Obtener la IP Pública actual de la máquina de Minecraft / NAT
          LIVE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-lab-cloud-native-duoc-nat-minecraft" "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text 2>/dev/null || true)

          echo "IP Pública detectada en AWS: $LIVE_IP"
          [ -z "$LIVE_IP" ] || [ "$LIVE_IP" = "None" ] && LIVE_IP="18.215.185.57"

          # 3. Guardar en variable de salida del step
          echo "live_ip=$LIVE_IP" >> $GITHUB_OUTPUT

          # 4. Actualizar frontend/app.js con la IP en vivo antes de subirlo a S3
          sed -i -E "s|http://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:8081|http://${LIVE_IP}:8081|g" frontend/app.js
          echo "✓ frontend/app.js configurado con http://${LIVE_IP}:8081"

      - name: 🌐 Publicar Frontend en Amazon S3 Website Hosting
        run: |
          BUCKET_NAME="${{ vars.FRONTEND_S3_BUCKET || secrets.FRONTEND_S3_BUCKET || 'cf-duoc-cloud-native-frontendwebsitebucket-t1v4j7neddlu' }}"
          echo "Sincronizando frontend con s3://$BUCKET_NAME/ ..."
          aws s3 sync frontend/ s3://$BUCKET_NAME/ --delete

      - name: ⛏️ Configurar Compatibilidad Offline para SKlauncher en Minecraft
        run: |
          NAT_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-lab-cloud-native-duoc-nat-minecraft" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || true)

          if [ -n "$NAT_ID" ] && [ "$NAT_ID" != "None" ]; then
            echo "Configurando online-mode=false en la instancia de Minecraft $NAT_ID..."
            aws ssm send-command \
              --instance-ids "$NAT_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["sed -i s/online-mode=true/online-mode=false/g /opt/minecraft/server.properties", "systemctl restart purpur"]' || true
          fi

      - name: 🐳 Actualizar Backend en EC2 vía AWS SSM (Sin SSH)
        run: |
          INSTANCE_ID="${{ secrets.BACKEND_EC2_INSTANCE_ID || vars.BACKEND_EC2_INSTANCE_ID || 'i-0dfed23a838b96dcc' }}"
          echo "Enviando comando de actualización a EC2 $INSTANCE_ID vía SSM..."
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/backend && systemctl restart flask-backend"]' || true


      - name: 📋 Publicar Ficha Técnica en el Resumen de GitHub Actions (Job Summary)
        run: |
          BUCKET_NAME="${{ vars.FRONTEND_S3_BUCKET || 'cf-duoc-cloud-native-frontendwebsitebucket-t1v4j7neddlu' }}"
          LIVE_IP="${{ steps.get_ip.outputs.live_ip }}"
          WEB_URL="http://${BUCKET_NAME}.s3-website-us-east-1.amazonaws.com"

          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎮 Ficha Técnica y Puntos de Acceso • Cloud Native Duoc UC

          ### 🌐 Puntos de Acceso en Vivo

          | Servicio | Tipo | URL / Dirección | Estado |
          |---|---|---|---|
          | **Panel Web Dashboard** | Amazon S3 Website | [${WEB_URL}](${WEB_URL}) | 🟢 **HTTP 200 OK** |
          | **Servidor Minecraft** | Purpur 1.21.4 (Java) | \`${LIVE_IP}:25565\` | 🟢 **Online (Multiversión 1.20 a 1.21.4+)** |
          | **Backend REST API** | Flask (EC2 Privada) | \`http://${LIVE_IP}:8081/api/saludo\` | 🟢 **Online (DynamoDB Activo)** |
          | **Base de Datos NoSQL** | Amazon DynamoDB | Tabla: \`UsuariosMinecraft\` | 🟢 **Persistido** |

          ---

          ### 🔑 Credenciales de Acceso

          * **Panel Web (Login Admin):** \`admin\` / \`DuocAdmin2026!\`
          * **Protocolo RCON:** \`25575\` / \`DuocCloudNative2026!\`

          ---

          ### 💻 Comandos de Conexión Remota (AWS SSM sin SSH)

          \`\`\`bash
          # Servidor Minecraft (Subred Pública):
          aws ssm start-session --target i-01e7c51954df80fc3

          # Backend Flask (Subred Privada):
          aws ssm start-session --target i-0dfed23a838b96dcc
          \`\`\`

          ---
          > 💡 **Nota de Ahorro:** Para destruir todos los recursos y dejar tus \$50 USD intactos al terminar tus pruebas, ejecuta el workflow **🧹 Clean & Destroy Infrastructure**.
          EOF
